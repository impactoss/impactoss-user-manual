<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMPACT OSS - User Manual</title>
    <meta name="description" content="User manual for IMPACT OSS - Open Source Software for Integrated Management and Planning of Actions">

    <!-- Docsify theme -->
    <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">

    <!--
      IMPACT OSS brand overrides
      ==========================================================
      To create a themed branch (e.g. Scottish Government):
      1. Create a new git branch
      2. Override the CSS variables below with the new brand colors
         e.g. Scottish Gov: --brand-primary: #0065bd; --brand-dark: #002d54;
    -->
    <style>
      :root {
        /* ===== IMPACT OSS Brand Colors ===== */
        /* Update these variables to rebrand for a different installation */
        --brand-primary: #033a8a;        /* Main blue - links, headings, accents */
        --brand-dark: #022a65;           /* Darker shade - sidebar name, h1 borders */
        --brand-light: #eaf0f8;          /* Light tint - sidebar bg, blockquotes */
        --brand-orange: #ee7001;         /* Orange accent */
        --brand-green: #1bac29;          /* Green accent */
        --brand-blue: #009ed8;           /* Light blue accent */
        --brand-text: #333333;           /* Body text */
        --brand-text-light: #666666;     /* Secondary text */

        /* Docsify theme variables */
        --theme-color: var(--brand-primary);
        --sidebar-width: 280px;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        color: var(--brand-text);
      }

      /* ===== Sidebar ===== */
      .sidebar {
        background-color: var(--brand-light);
        border-right: 1px solid #d8e2ec;
      }

      .sidebar .app-name-link {
        font-weight: 700;
        color: var(--brand-dark);
      }

      .sidebar .sidebar-nav {
        padding-top: 0.5rem;
      }

      .sidebar ul li a {
        color: var(--brand-text);
        font-size: 0.9rem;
        transition: color 0.15s;
      }

      .sidebar ul li a:hover {
        color: var(--brand-primary);
      }

      .sidebar ul li a.active {
        color: var(--brand-primary);
        font-weight: 600;
        border-right: 3px solid var(--brand-primary);
      }

      /* Sidebar search */
      .sidebar .search {
        border-bottom: 1px solid #d8e2ec;
        padding: 6px;
      }

      .sidebar .search .input-wrap {
        border-color: #ccd6e0;
      }

      .sidebar .search .input-wrap input {
        font-size: 0.85rem;
        color: var(--brand-text);
      }

      /* ===== Main content ===== */
      .markdown-section {
        max-width: 820px;
      }

      .markdown-section h1 {
        color: var(--brand-dark);
        border-bottom: 2px solid var(--brand-primary);
        padding-bottom: 0.4rem;
        margin-top: 2rem;
      }

      .markdown-section h2 {
        color: var(--brand-dark);
        margin-top: 1.8rem;
      }

      .markdown-section h3,
      .markdown-section h4 {
        color: var(--brand-dark);
      }

      .markdown-section a {
        color: var(--brand-primary);
      }

      .markdown-section a:hover {
        color: var(--brand-blue);
      }

      .markdown-section img {
        max-width: 100%;
        border: 1px solid #dee2e6;
        border-radius: 4px;
        margin: 1rem 0;
        box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      }

      .markdown-section blockquote {
        border-left: 4px solid var(--brand-primary);
        background-color: var(--brand-light);
        padding: 0.8rem 1rem;
        margin: 1rem 0;
      }

      .markdown-section code {
        background-color: #f0f4f8;
        color: var(--brand-dark);
        border-radius: 3px;
        padding: 2px 5px;
      }

      .markdown-section table th {
        background-color: var(--brand-dark);
        color: #fff;
      }

      .markdown-section table td,
      .markdown-section table th {
        border: 1px solid #dee2e6;
        padding: 8px 12px;
      }

      .markdown-section table tr:nth-child(even) {
        background-color: #f8f9fa;
      }

      /* ===== Cover page ===== */
      section.cover {
        background: linear-gradient(135deg, var(--brand-dark) 0%, var(--brand-primary) 100%) !important;
      }

      section.cover .cover-main > p:last-child a {
        background-color: #fff;
        color: var(--brand-dark);
        border: none;
        border-radius: 4px;
        padding: 0.6rem 2rem;
        font-weight: 600;
      }

      section.cover .cover-main > p:last-child a:hover {
        opacity: 0.9;
      }

      /* ===== Pagination plugin ===== */
      .docsify-pagination-container {
        border-top: 1px solid #dee2e6;
        margin-top: 2rem;
      }

      .pagination-item-label {
        color: var(--brand-text-light);
      }

      .pagination-item-title {
        color: var(--brand-primary);
      }

      /* ===== Print ===== */
      @media print {
        .sidebar,
        .sidebar-toggle {
          display: none !important;
        }
        .content {
          margin-left: 0 !important;
        }
        .markdown-section {
          max-width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="app">Loading...</div>

    <script>
      window.$docsify = {
        // ===== Site identity =====
        name: 'IMPACT OSS<br><small style="font-size:0.55em;font-weight:400;color:#888;">User Manual</small>',
        nameLink: '/',
        // logo: '/assets/logo.svg',  // Uncomment and set path if you add a logo

        // ===== Sidebar =====
        // Loads the existing GitBook SUMMARY.md as the navigation sidebar
        loadSidebar: 'SUMMARY.md',
        subMaxLevel: 2,
        alias: {
          // Ensure SUMMARY.md is used for all paths
          '/.*/_sidebar.md': '/SUMMARY.md',
        },

        // ===== Cover page =====
        // Create a _coverpage.md file to enable
        // coverpage: true,

        // ===== Search =====
        search: {
          placeholder: 'Search the manual...',
          noData: 'No results found',
          depth: 3,
          pathNamespaces: ['/'],
        },

        // ===== Behaviour =====
        auto2top: true,
        maxLevel: 4,
        noEmoji: true,
        themeColor: '#033a8a',

        // ===== Repository =====
        repo: 'https://github.com/impactoss/impactoss-user-manual',

        // ===== Pagination =====
        pagination: {
          previousText: '← Previous',
          nextText: 'Next →',
          crossChapter: true,
          crossChapterText: true,
        },

        // ===== Copy code button =====
        copyCode: {
          buttonText: 'Copy',
          successText: 'Copied',
        },
      }
    </script>

    <!-- Docsify core -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

    <!-- Plugins -->
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
    <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/zoom-image.min.js"></script>
  </body>
</html>
